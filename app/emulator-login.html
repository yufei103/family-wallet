<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Wallet V2 测试登录</title><style>body{font-family:system-ui;margin:auto;max-width:420px;padding:32px;background:#f5f8fa;color:#112a35}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccd8dc;font:inherit}button{background:#057c85;color:#fff;border:0;font-weight:700}.note{font-size:13px;color:#53666e}.status{padding:12px;background:#e4f2f1;border-radius:10px;margin-top:14px}</style><h1>测试登录</h1><p class="note">仅连接本机 Auth Emulator：demo-family-wallet-v2。不会连接正式 Firebase。</p><input id="email" type="email" placeholder="测试邮箱，例如 owner@example.com"><input id="password" type="password" placeholder="密码至少 6 位"><button id="register">注册测试帐号</button><button id="login">登录</button><button id="logout">登出</button><div class="status" id="status">初始化中…</div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';import{getAuth,connectAuthEmulator,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';if(!['127.0.0.1','localhost'].includes(location.hostname))throw Error('测试登录只允许本机打开');const auth=getAuth(initializeApp({apiKey:'demo-local-only',authDomain:'demo-family-wallet-v2.local',projectId:'demo-family-wallet-v2'}));connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});const $=x=>document.querySelector(x),status=x=>$('#status').textContent=x,cred=()=>[$('#email').value.trim(),$('#password').value];$('#register').onclick=async()=>{try{const[e,p]=cred();const r=await createUserWithEmailAndPassword(auth,e,p);status('已注册并登录：'+r.user.uid)}catch(e){status(e.message)}};$('#login').onclick=async()=>{try{const[e,p]=cred();const r=await signInWithEmailAndPassword(auth,e,p);status('已登录：'+r.user.uid)}catch(e){status(e.message)}};$('#logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>status(u?'当前测试 UID：'+u.uid:'未登录。可注册或登录测试帐号。'));</script>
